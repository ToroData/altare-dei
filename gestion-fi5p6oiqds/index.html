<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Panel · Misas Tradicionales BCN</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* Panel de administración: misma base visual que la web (listas agrupadas, tipografía del sistema). */
:root {
  --bg: #f2f2f4; --card: #ffffff; --text: #1d1d1f; --text-2: #5f5f66; --text-3: #86868c;
  --sep: rgba(60, 60, 67, 0.16); --fill: rgba(118, 118, 128, 0.12); --accent: #8f6a2e; --on-accent: #ffffff;
  --ok: #1f7a45; --warn-bg: #fff4e0; --warn-fg: #7a4a00; --err: #c0262d; --err-bg: #fdecec;
  --ch-I: #3c6e9f; --ch-II: #2e8379; --ch-III: #a2582b;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-display: "EB Garamond", Georgia, serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --text-2: #a8a8ae; --text-3: #7c7c82; --sep: rgba(84,84,88,.55);
    --fill: rgba(118,118,128,.24); --accent: #dcb36f; --on-accent: #1d1d1f; --ok: #5ccb88; --warn-bg: #3a2a0c; --warn-fg: #ffd28a;
    --err: #ff6b6b; --err-bg: #3a1414; --ch-I: #8bb9e8; --ch-II: #6fcbbf; --ch-III: #eba277; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --text-2: #a8a8ae; --text-3: #7c7c82; --sep: rgba(84,84,88,.55);
  --fill: rgba(118,118,128,.24); --accent: #dcb36f; --on-accent: #1d1d1f; --ok: #5ccb88; --warn-bg: #3a2a0c; --warn-fg: #ffd28a;
  --err: #ff6b6b; --err-bg: #3a1414; --ch-I: #8bb9e8; --ch-II: #6fcbbf; --ch-III: #eba277; --shadow: none; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; letter-spacing: -.01em; }
[hidden] { display: none !important; }

.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow: auto; padding: 24px 12px; border-right: .5px solid var(--sep); background: var(--bg); }
.side .brand { padding: 0 10px 18px; }
.side .brand b { display: block; font-family: var(--font-display); font-weight: 500; font-size: 21px; }
.side .brand span { font-size: 12.5px; color: var(--text-3); }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav button { text-align: left; padding: 9px 12px; border: 0; border-radius: 9px; background: none; cursor: pointer; font-weight: 500; color: var(--text-2); display: flex; align-items: center; gap: 10px; }
.side nav button[aria-current="page"] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.side nav button .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--text-3)); }
.side .who { margin-top: 22px; padding: 12px; font-size: 13px; color: var(--text-3); border-top: .5px solid var(--sep); }
main { padding: 28px max(20px, env(safe-area-inset-right, 0px)) 60px max(20px, env(safe-area-inset-left, 0px)); max-width: 860px; width: 100%; }
.title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.title h1 { font-size: 30px; }
.title p { margin: 4px 0 0; color: var(--text-2); }

.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.list { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; position: relative; min-height: 52px; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.item .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .main b { font-weight: 600; overflow-wrap: anywhere; }
.item .main span { font-size: 13.5px; color: var(--text-2); overflow-wrap: anywhere; }
.empty { padding: 22px 16px; text-align: center; color: var(--text-2); }
.h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 4px 8px; }
.h2 h2 { font-size: 18px; }
.muted { color: var(--text-2); } .faint { color: var(--text-3); font-size: 13px; }

.btn { height: 38px; padding: 0 14px; border-radius: 10px; border: 0; cursor: pointer; background: var(--fill); color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; transition: transform .12s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--err); }
.btn.danger.armed { background: var(--err); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13.5px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

form.card { display: flex; flex-direction: column; gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--text-2); }
label.f > input, label.f > select, label.f > textarea, .in { height: 40px; padding: 0 12px; border-radius: 10px; border: .5px solid var(--sep); background: var(--bg); font-weight: 400; font-size: 15px; color: var(--text); width: 100%; min-width: 0; }
label.f > textarea { height: auto; min-height: 120px; padding: 10px 12px; line-height: 1.5; resize: vertical; }
textarea.md { min-height: 320px !important; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px !important; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 500; color: var(--text); }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.days { display: flex; gap: 4px; flex-wrap: wrap; }
.days label { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 32px; border-radius: 8px; background: var(--fill); font-size: 13px; font-weight: 600; cursor: pointer; }
.days input { position: absolute; opacity: 0; width: 0; height: 0; }
.days label:has(input:checked) { background: var(--accent); color: var(--on-accent); }
.rule { display: grid; grid-template-columns: 1fr 100px 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-top: .5px solid var(--sep); }
.rule:first-child { border-top: 0; }

.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--c, var(--text-3)) 14%, transparent); color: var(--c, var(--text-2)); white-space: nowrap; }
.ch-I { --c: var(--ch-I); } .ch-II { --c: var(--ch-II); } .ch-III { --c: var(--ch-III); }
.ok { --c: var(--ok); } .bad { --c: var(--err); }
.note { padding: 12px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--warn-fg); font-size: 14px; }
.note.err { background: var(--err-bg); color: var(--err); }
.prose { font-family: var(--font-display); font-size: 19px; line-height: 1.55; }
.prose blockquote { margin: 1em 0; padding-left: 14px; border-left: 3px solid var(--accent); color: var(--text-2); font-style: italic; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.thumbs figure { margin: 0; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.thumbs img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--fill); }
.thumbs figcaption { padding: 8px 10px; font-size: 12.5px; color: var(--text-2); display: flex; flex-direction: column; gap: 6px; }

.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login .card { width: min(440px, 100%); padding: 26px; display: flex; flex-direction: column; gap: 14px; }
.login h1 { font-family: var(--font-display); font-weight: 500; font-size: 28px; }
.login ol { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s; z-index: 50; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--err); color: #fff; }
.busy { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 50%, transparent); display: grid; place-items: center; z-index: 40; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--fill); border-top-color: var(--accent); animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: sticky; top: 0; z-index: 10; height: auto; padding: 10px 8px 8px; border-right: 0; border-bottom: .5px solid var(--sep); }
  .side .brand, .side .who { display: none; }
  .side nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  .side nav button { flex: none; }
  .rule { grid-template-columns: 1fr 1fr; }
  main { padding-top: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="busy" id="busy" hidden><div class="spin" aria-label="Guardando"></div></div>

<script>
(() => {
  "use strict";
  const REPO = "ToroData/hub-bcn";
  const API = "https://api.github.com";
  const PUBLIC_URL = "../";
  const CH = { I: "Sants", II: "Vallcarca", III: "Laforja" };
  const DAYS = [["mon", "L"], ["tue", "M"], ["wed", "X"], ["thu", "J"], ["fri", "V"], ["sat", "S"], ["sun", "D"]];
  const KINDS = ["Misa rezada", "Misa cantada", "Misa solemne", "Santo Rosario", "Confesiones", "Exposición y bendición", "Vía Crucis", "Hora Santa", "Catecismo", "Conferencia"];
  const AG_KINDS = ["Formación", "Actividad", "Liturgia", "Devoción", "Peregrinación"];
  const app = document.getElementById("app");
  const st = { token: null, user: null, perms: null, caps: new Set(), role: null, section: "estado", data: {}, edit: null };

  // --------------------------------------------------------------- utilidades
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Madrid" }).format(new Date());
  const uid = () => Math.random().toString(36).slice(2, 10);
  const slugify = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 70) || "entrada";
  const store = {
    get(k) { try { return sessionStorage.getItem("aadm:" + k) ?? localStorage.getItem("aadm:" + k); } catch { return null; } },
    set(k, v, remember) { try { (remember ? localStorage : sessionStorage).setItem("aadm:" + k, v); } catch {} },
    clear() { try { ["token"].forEach((k) => { sessionStorage.removeItem("aadm:" + k); localStorage.removeItem("aadm:" + k); }); } catch {} },
  };
  function toast(msg, err) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), err ? 5000 : 2200); }
  const busy = (on) => { document.getElementById("busy").hidden = !on; };
  const b64enc = (str) => { const bytes = new TextEncoder().encode(str); let bin = ""; bytes.forEach((b) => (bin += String.fromCharCode(b))); return btoa(bin); };
  const b64dec = (b64) => { const bin = atob(b64.replace(/\n/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))); };
  const fmtDate = (s) => { if (!s) return ""; const [y, m, d] = s.slice(0, 10).split("-"); return `${+d}/${+m}/${y}`; };
  const can = (cap) => st.caps.has("*") || st.caps.has(cap);

  // --------------------------------------------------------------- GitHub
  async function gh(path, opts = {}) {
    const r = await fetch(API + path, { ...opts, headers: { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", Authorization: `Bearer ${st.token}`, ...(opts.body ? { "Content-Type": "application/json" } : {}), ...(opts.headers || {}) } });
    if (r.status === 204) return null;
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.message || `Error ${r.status}`); e.status = r.status; throw e; }
    return j;
  }
  const repoPath = (p) => `/repos/${REPO}/contents/${p.split("/").map(encodeURIComponent).join("/")}`;
  async function getText(path) { const j = await gh(repoPath(path) + "?ref=main"); return { sha: j.sha, text: b64dec(j.content) }; }
  async function getJSON(path) { const f = await getText(path); return { sha: f.sha, data: JSON.parse(f.text) }; }
  async function putRaw(path, b64, message, sha) { return gh(repoPath(path), { method: "PUT", body: JSON.stringify({ message, content: b64, branch: "main", ...(sha ? { sha } : {}) }) }); }
  async function putText(path, text, message, sha) { return putRaw(path, b64enc(text), message, sha); }
  async function del(path, message, sha) { return gh(repoPath(path), { method: "DELETE", body: JSON.stringify({ message, sha, branch: "main" }) }); }
  async function list(path) { try { return await gh(repoPath(path) + "?ref=main"); } catch (e) { if (e.status === 404) return []; throw e; } }
  // Lee la versión más reciente, aplica el cambio y guarda; si otro guardó entre medias, reintenta una vez.
  async function mutateJSON(path, fn, message) {
    for (let attempt = 0; attempt < 2; attempt++) {
      const { sha, data } = await getJSON(path);
      fn(data);
      try { await putText(path, JSON.stringify(data, null, 2) + "\n", message, sha); return data; }
      catch (e) { if (e.status !== 409 || attempt) throw e; }
    }
  }
  async function dispatch(wf) { await gh(`/repos/${REPO}/actions/workflows/${wf}/dispatches`, { method: "POST", body: JSON.stringify({ ref: "main" }) }); }
  async function save(fn, okMsg) {
    busy(true);
    try { await fn(); toast(okMsg || "Guardado. La web se actualizará en unos minutos."); return true; }
    catch (e) { toast(e.status === 403 || e.status === 404 ? "Sin permiso para esta acción con este token." : `No se pudo guardar: ${e.message}`, true); return false; }
    finally { busy(false); }
  }

  // --------------------------------------------------------------- acceso
  function vLogin(msg) {
    app.innerHTML = `<div class="login"><form class="card" id="loginf">
      <div><div class="faint">Misas Tradicionales BCN</div><h1>Panel de gestión</h1></div>
      ${msg ? `<div class="note err">${esc(msg)}</div>` : ""}
      <label class="f">Token de acceso de GitHub<input type="password" id="tok" autocomplete="off" spellcheck="false" placeholder="github_pat_…" required></label>
      <label class="check"><input type="checkbox" id="remember"> Recordar en este dispositivo</label>
      <button class="btn primary" type="submit">Entrar</button>
      <details><summary class="faint" style="cursor:pointer">Cómo crear el token</summary>
        <ol style="margin-top:8px">
          <li>En GitHub: Settings → Developer settings → <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained tokens</a>.</li>
          <li>Repositorio: sólo <b>${esc(REPO)}</b>.</li>
          <li>Permisos: <b>Contents</b> lectura y escritura, <b>Actions</b> lectura y escritura.</li>
          <li>Caducidad: la más corta que te resulte cómoda.</li>
        </ol></details>
      <p class="faint" style="margin:0">El token sólo se guarda en este navegador. Cierra sesión en dispositivos compartidos.</p>
    </form></div>`;
    document.getElementById("loginf").addEventListener("submit", async (e) => {
      e.preventDefault();
      st.token = document.getElementById("tok").value.trim();
      const remember = document.getElementById("remember").checked;
      if (await boot()) store.set("token", st.token, remember); else st.token = null;
    });
  }
  async function boot() {
    busy(true);
    try {
      const [user, repo] = await Promise.all([gh("/user"), gh(`/repos/${REPO}`)]);
      st.user = user; st.perms = repo.permissions || {};
      if (!st.perms.push) throw Object.assign(new Error("Este token no tiene permiso de escritura en el repositorio."), { status: 403 });
      const roles = (await getJSON("data/roles.json")).data;
      st.role = roles.users[user.login] || (st.perms.admin ? "admin" : null);
      st.caps = new Set(roles.roles[st.role] || []);
      st.rolesDoc = roles;
      if (!st.caps.size) throw new Error(`La cuenta ${user.login} no tiene un rol asignado en data/roles.json.`);
      const first = ["estado", "avisos", "agenda", "horarios", "blog", "catequesis", "fotos", "capillas"].find(can);
      st.section = first || "cuenta";
      await render();
      return true;
    } catch (e) {
      vLogin(e.status === 401 ? "Token no válido o caducado." : e.message);
      return false;
    } finally { busy(false); }
  }

  // --------------------------------------------------------------- estructura
  const SECTIONS = [
    ["estado", "Estado", "estado"], ["avisos", "Avisos", "avisos"], ["agenda", "Agenda", "agenda"], ["horarios", "Horarios", "horarios"],
    ["blog", "Blog", "blog"], ["catequesis", "Catequesis", "catequesis"], ["fotos", "Fotos", "fotos"], ["capillas", "Capillas", "capillas"], ["cuenta", "Cuenta", null],
  ];
  async function render() {
    const nav = SECTIONS.filter(([, , cap]) => !cap || can(cap));
    app.innerHTML = `<div class="shell"><aside class="side"><div class="brand"><b>Misas Tradicionales BCN</b><span>Panel de gestión</span></div>
      <nav aria-label="Secciones">${nav.map(([k, l]) => `<button data-sec="${k}" ${st.section === k ? 'aria-current="page"' : ""}>${l}</button>`).join("")}</nav>
      <div class="who">${esc(st.user.login)} · ${esc(st.role)}<br><a href="${PUBLIC_URL}" target="_blank" rel="noopener">Ver la web ↗</a></div></aside>
      <main id="main"><div class="empty">Cargando…</div></main></div>`;
    app.querySelector("nav").addEventListener("click", (e) => { const b = e.target.closest("[data-sec]"); if (!b) return; st.section = b.dataset.sec; st.edit = null; render(); });
    const main = document.getElementById("main");
    try { main.innerHTML = await VIEWS[st.section](); bind(main); }
    catch (e) { main.innerHTML = `<div class="note err">No se pudo cargar: ${esc(e.message)}</div>`; }
    window.scrollTo(0, 0);
  }
  const title = (t, sub, right = "") => `<div class="title"><div><h1>${t}</h1>${sub ? `<p>${sub}</p>` : ""}</div><div class="row">${right}</div></div>`;
  const chTag = (id) => id && CH[id] ? `<span class="tag ch-${id}">${CH[id]}</span>` : `<span class="tag">Todas</span>`;
  const chSelect = (name, val, all = true) => `<select name="${name}">${all ? `<option value="">Todas las capillas</option>` : ""}${Object.entries(CH).map(([k, v]) => `<option value="${k}" ${val === k ? "selected" : ""}>${v}</option>`).join("")}</select>`;
  const delBtn = (act, v) => `<button type="button" class="btn sm danger" data-del="${act}" data-v="${esc(v)}">Borrar</button>`;

  // --------------------------------------------------------------- vistas
  const VIEWS = {
    async estado() {
      const [site, runs] = await Promise.all([getJSON("data/site.json").then((x) => x.data), gh(`/repos/${REPO}/actions/runs?per_page=8`)]);
      const stale = site.chapels.filter((c) => c.status && c.status.stale);
      const icon = (r) => r.status !== "completed" ? `<span class="tag">En curso</span>` : r.conclusion === "success" ? `<span class="tag ok">Correcto</span>` : `<span class="tag bad">${r.conclusion === "cancelled" ? "Cancelado" : "Fallo"}</span>`;
      return `${title("Estado", `Datos del ${fmtDate(site.from)} al ${fmtDate(site.to)}`)}
        <div class="grid2">
          <div class="card"><div class="faint">Lectura de las capillas</div><div style="font-size:20px;font-weight:600;margin-top:4px">${stale.length ? `${stale.length} sin leer hoy` : "Todas al día"}</div>
            <div class="row" style="margin-top:8px">${site.chapels.map((c) => `<span class="tag ${c.status && c.status.stale ? "bad" : "ok"}">${CH[c.id]}</span>`).join("")}</div></div>
          <div class="card"><div class="faint">Avisos de coherencia</div><div style="font-size:20px;font-weight:600;margin-top:4px">${(site.checks || []).length || "Ninguno"}</div>
            ${(site.checks || []).slice(0, 3).map((c) => `<div class="faint" style="margin-top:4px">${fmtDate(c.date)}: hoja ${esc(c.pdf)}, calendario ${esc(c.calendario_1962)}</div>`).join("")}</div>
        </div>
        <div class="h2"><h2>Acciones</h2></div>
        <div class="card stack"><div class="row">
          <button class="btn" data-run="update.yml">Actualizar horarios ahora</button>
          <button class="btn" data-run="mapa.yml">Regenerar mapa</button>
          <button class="btn" data-run="fotos.yml">Importar fotos</button>

  // --------------------------------------------------------------- blog y catequesis
  const COLL = {
    blog: { dir: "content/blog", label: "Blog", item: "entrada", fields: ["author", "tags"] },
    catequesis: { dir: "content/catequesis", label: "Catequesis", item: "lección", fields: ["serie", "order"] },
  };
  function parseMD(text) {
    const meta = {}; let body = text;
    if (text.startsWith("---")) { const parts = text.split("---"); parts.slice(1, 2)[0].trim().split("\n").forEach((l) => { const i = l.indexOf(":"); if (i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim().replace(/^"|"$/g, ""); }); body = parts.slice(2).join("---").trim(); }
    return { meta, body };
  }
  const fm = (meta, body) => `---\n${Object.entries(meta).filter(([, v]) => v !== "" && v != null).map(([k, v]) => `${k}: ${String(v).replace(/\n/g, " ")}`).join("\n")}\n---\n\n${body.trim()}\n`;
  function mdPreview(src) {
    const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return src.split(/\n{2,}/).map((b) => {
      if (/^#{1,3} /.test(b)) return `<h3>${inline(b.replace(/^#+ /, ""))}</h3>`;
      if (/^> /.test(b)) return `<blockquote>${inline(b.replace(/^> ?/gm, ""))}</blockquote>`;
      if (/^[-*] /.test(b)) return `<ul>${b.split("\n").map((l) => `<li>${inline(l.replace(/^[-*] /, ""))}</li>`).join("")}</ul>`;
      if (/^\d+\. /.test(b)) return `<ol>${b.split("\n").map((l) => `<li>${inline(l.replace(/^\d+\. /, ""))}</li>`).join("")}</ol>`;
      return `<p>${inline(b).replace(/\n/g, "<br>")}</p>`;
    }).join("");
  }
  async function collectionView(name) {
    const c = COLL[name];
    const files = (await list(c.dir)).filter((f) => f.name.endsWith(".md"));
    if (st.edit && st.edit.type === name) {
      let meta = { title: "", date: today(), summary: "", draft: "false", author: st.user.name || st.user.login, tags: "", serie: "", order: "" }, body = "", sha = null, path = null;
      if (st.edit.id) { const f = await getText(`${c.dir}/${st.edit.id}`); const p = parseMD(f.text); meta = { ...meta, ...p.meta }; body = p.body; sha = f.sha; path = `${c.dir}/${st.edit.id}`; }
      st.data.coll = { name, sha, path };
      return `${title(st.edit.id ? `Editar ${c.item}` : `Nueva ${c.item}`, c.label, `<button class="btn" data-cancel>Volver</button>`)}
        <form class="card" data-form="coll">
          <label class="f">Título<input name="title" required maxlength="120" value="${esc(meta.title)}"></label>
          <div class="grid2"><label class="f">Fecha<input type="date" name="date" required value="${esc(meta.date)}"></label>
            ${c.fields.includes("author") ? `<label class="f">Autor<input name="author" value="${esc(meta.author)}"></label>` : ""}
            ${c.fields.includes("tags") ? `<label class="f">Etiquetas (separadas por comas)<input name="tags" value="${esc(meta.tags)}"></label>` : ""}
            ${c.fields.includes("serie") ? `<label class="f">Tema o serie<input name="serie" value="${esc(meta.serie)}" placeholder="Los sacramentos"></label><label class="f">Número de lección<input type="number" min="0" name="order" value="${esc(meta.order)}"></label>` : ""}</div>
          <label class="f">Resumen<input name="summary" maxlength="200" value="${esc(meta.summary)}"></label>
          <label class="f">Texto (Markdown: **negrita**, *cursiva*, ## título, > cita, - lista, [enlace](https://…))<textarea class="md" name="body" required>${esc(body)}</textarea></label>
          <details><summary class="faint" style="cursor:pointer">Vista previa</summary><div class="prose" id="preview" style="margin-top:10px">${mdPreview(body)}</div></details>
          <label class="check"><input type="checkbox" name="draft" ${meta.draft === "true" ? "checked" : ""}> Borrador (no se publica)</label>
          <div class="row"><button class="btn primary" type="submit">${st.edit.id ? "Guardar cambios" : "Publicar"}</button><button class="btn" type="button" data-cancel>Cancelar</button></div>
        </form>`;
    }
    const metas = await Promise.all(files.slice(0, 60).map(async (f) => { try { const t = await getText(f.path); return { f, ...parseMD(t.text) }; } catch { return { f, meta: {}, body: "" }; } }));
    metas.sort((a, b) => (b.meta.date || "").localeCompare(a.meta.date || ""));
    return `${title(c.label, name === "blog" ? "Entradas del blog público." : "Lecciones agrupadas por tema.", `<button class="btn primary" data-new="${name}">Nueva ${c.item}</button>`)}
      <div class="list">${metas.map(({ f, meta }) => `<div class="item"><span class="main"><b>${esc(meta.title || f.name)}</b><span>${fmtDate(meta.date)}${meta.serie ? ` · ${esc(meta.serie)}` : ""}${meta.draft === "true" ? " · borrador" : ""}</span></span><button class="btn sm" data-edit="${name}" data-v="${esc(f.name)}">Editar</button>${delBtn(name, `${f.path}|${f.sha}`)}</div>`).join("") || `<div class="empty">Todavía no hay ${c.item === "lección" ? "lecciones" : "entradas"}.</div>`}</div>`;
  }

  // --------------------------------------------------------------- fotos
  function resize(file, max = 2400) {
    return new Promise((res, rej) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
        res(cv.toDataURL("image/jpeg", 0.88).split(",")[1]);
      };
      img.onerror = () => rej(new Error("No se pudo leer la imagen"));
      img.src = url;
    });
  }

  // --------------------------------------------------------------- eventos
  function bind(root) {
    root.addEventListener("click", async (e) => {
      const t = e.target.closest("button, a"); if (!t) return;
      if (t.dataset.reload !== undefined) return render();
      if (t.dataset.cancel !== undefined) { st.edit = null; return render(); }
      if (t.dataset.logout !== undefined) { store.clear(); st.token = null; return vLogin(); }
      if (t.dataset.new) { st.edit = { type: t.dataset.new, id: null }; return render(); }
      if (t.dataset.edit) { st.edit = { type: t.dataset.edit, id: t.dataset.v }; return render(); }
      if (t.dataset.addrule !== undefined) { root.querySelector("#rules").insertAdjacentHTML("beforeend", ruleRow()); return; }
      if (t.dataset.rmrule !== undefined) { t.closest("[data-rule]").remove(); return; }
      if (t.dataset.run) {
        if (t.dataset.confirm && !t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Pulsa otra vez para publicar"; setTimeout(() => { t.classList.remove("armed"); t.textContent = "Publicar la web"; }, 4000); return; }
        if (await save(() => dispatch(t.dataset.run), "Lanzado. Mira «Últimas ejecuciones» en un minuto.")) setTimeout(render, 2500);
        return;
      }
      if (t.dataset.del) {
        if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "¿Seguro?"; setTimeout(() => { t.classList.remove("armed"); t.textContent = "Borrar"; }, 3500); return; }
        const v = t.dataset.v, kind = t.dataset.del;
        let ok = false;
        if (kind === "aviso" || kind === "agenda") ok = await save(() => mutateJSON("data/overrides.json", (d) => { const k = kind === "aviso" ? "avisos" : "agenda"; d[k] = d[k].filter((x) => x.id !== v); }, `Panel: borrar ${kind}`), "Borrado.");
        else if (kind === "exception") { const [date, chapel, idx] = v.split("|"); ok = await save(() => mutateJSON("data/overrides.json", (d) => { const real = d.exceptions.filter((x) => !x._ejemplo).sort((a, b) => a.date.localeCompare(b.date))[+idx]; if (!real || real.date !== date || real.chapel !== chapel) throw new Error("La lista cambió; recarga y vuelve a intentarlo."); d.exceptions = d.exceptions.filter((x) => x !== real); }, "Panel: borrar cambio de horario"), "Borrado."); }
        else if (kind === "photo") { const [id, name, sha] = v.split("|"); ok = await save(async () => {
            await del(`media/chapels/${id}/${name}`, `Panel: borrar foto ${name}`, sha);
            try { await mutateJSON(`media/chapels/${id}/captions.json`, (d) => { delete d[name]; }, "Panel: pie de foto"); } catch {}
            try { await mutateJSON("media/sources.json", (d) => { d.photos = d.photos.filter((p) => !(p.chapel === id && p.file === name)); }, "Panel: quitar foto importada"); } catch {}
          }, "Foto borrada."); }
        else if (COLL[kind]) { const [path, sha] = v.split("|"); ok = await save(() => del(path, `Panel: borrar ${path.split("/").pop()}`, sha), "Borrado."); }
        if (ok) render();
      }
    });
    root.addEventListener("input", (e) => { if (e.target.name === "body" && root.querySelector("#preview")) root.querySelector("#preview").innerHTML = mdPreview(e.target.value); });
    root.addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target, fd = new FormData(f), kind = f.dataset.form, g = (k) => (fd.get(k) || "").toString().trim();
      let ok = false;
      if (kind === "aviso") {
        const item = { id: g("id") || uid(), date: g("date"), until: g("until") || undefined, chapel: g("chapel") || undefined, title: g("title"), body: g("body") };
        ok = await save(() => mutateJSON("data/overrides.json", (d) => { const i = d.avisos.findIndex((x) => x.id === item.id); if (i >= 0) d.avisos[i] = item; else d.avisos.push(item); }, `Panel: aviso «${item.title}»`));
      } else if (kind === "agenda") {
        const item = { id: g("id") || uid(), date: g("date"), time: g("time") || undefined, chapel: g("chapel") || undefined, kind: g("kind"), title: g("title"), meta: g("meta") };
        ok = await save(() => mutateJSON("data/overrides.json", (d) => { const i = d.agenda.findIndex((x) => x.id === item.id); if (i >= 0) d.agenda[i] = item; else d.agenda.push(item); }, `Panel: agenda «${item.title}»`));
      } else if (kind === "exception") {
        const add = [0, 1, 2].map((k) => ({ time: g("t" + k), kind: g("k" + k) })).filter((a) => a.time);
        if (!add.length && !fd.get("remove_all") && !g("note")) return toast("Añade una celebración, una nota o marca «Anular».", true);
        const item = { date: g("date"), chapel: g("chapel"), remove_all: !!fd.get("remove_all"), add, note: g("note") || undefined };
        ok = await save(() => mutateJSON("data/overrides.json", (d) => { d.exceptions.push(item); }, `Panel: cambio de horario ${item.date}`));
      } else if (kind === "regular") {
        const id = f.dataset.ch;
        const rules = [...f.querySelectorAll("[data-rule]")].map((r) => {
          const days = [...r.querySelectorAll(".days input:checked")].map((x) => x.value);
          const [time, kindSel] = [r.querySelector('input[type="time"]').value, r.querySelector("select").value];
          const o = { days, time: time.replace(/^0(\d):/, "$1:"), kind: kindSel };
          const m = r.querySelector("[data-months]"), s = r.querySelector("[data-skip]");
          if (m) o.months = m.value.split(",").map(Number); if (s) o.skip_months = s.value.split(",").map(Number);
          return o;
        }).filter((r) => r.days.length && r.time);
        ok = await save(() => mutateJSON("data/chapels.json", (d) => { d.chapels.find((c) => c.id === id).regular = rules; }, `Panel: horario habitual de ${CH[id]}`));
      } else if (kind === "chapel") {
        const id = f.dataset.ch;
        const links = [0, 1, 2].map((k) => ({ type: g("lt" + k), label: g("ll" + k), url: g("lu" + k) })).filter((l) => l.type && l.url);
        ok = await save(() => mutateJSON("data/chapels.json", (d) => { const c = d.chapels.find((x) => x.id === id);
          Object.assign(c, { phone: g("phone") || null, email: g("email") || null, phone_note: g("phone_note") || null, verified: !!fd.get("verified"), verified_note: g("verified_note") || undefined, links }); }, `Panel: datos de ${CH[id]}`));
      } else if (kind === "coll") {
        const { name, sha, path } = st.data.coll, c = COLL[name];
        const meta = { title: g("title"), date: g("date"), summary: g("summary"), draft: fd.get("draft") ? "true" : "false" };
        if (c.fields.includes("author")) meta.author = g("author");
        if (c.fields.includes("tags")) meta.tags = g("tags");
        if (c.fields.includes("serie")) { meta.serie = g("serie"); meta.order = g("order"); }
        const target = path || `${c.dir}/${name === "blog" ? meta.date + "-" : ""}${slugify(meta.title)}.md`;
        ok = await save(async () => {
          if (!path) { const exists = await list(target).then((x) => !Array.isArray(x)).catch(() => false); if (exists) throw new Error("Ya existe otra con ese título."); }
          await putText(target, fm(meta, g("body")), `Panel: ${meta.draft === "true" ? "borrador" : "publicar"} «${meta.title}»`, sha);
        }, meta.draft === "true" ? "Borrador guardado." : "Guardado. Se verá en la web en la próxima publicación.");
        if (ok) st.edit = null;
      } else if (kind === "photo") {
        const file = fd.get("file"); if (!file || !file.size) return;
        const id = g("chapel");
        ok = await save(async () => {
          const existing = (await list(`media/chapels/${id}`)).filter((x) => /\.(jpe?g|png|webp)$/i.test(x.name));
          const name = `${String(existing.length + 1).padStart(2, "0")}-${slugify(g("caption") || file.name.replace(/\.\w+$/, ""))}.jpg`;
          await putRaw(`media/chapels/${id}/${name}`, await resize(file), `Panel: foto ${name}`);
          try { await mutateJSON(`media/chapels/${id}/captions.json`, (d) => { d[name] = { caption: g("caption"), credit: g("credit"), source: g("source") }; }, "Panel: pie de foto"); }
          catch (err) { if (err.status !== 404) throw err; await putText(`media/chapels/${id}/captions.json`, JSON.stringify({ [name]: { caption: g("caption"), credit: g("credit"), source: g("source") } }, null, 2) + "\n", "Panel: pie de foto"); }
        }, "Foto subida.");
      }
      if (ok) { if (kind !== "coll") st.edit = null; render(); }
    });
  }

  // --------------------------------------------------------------- arranque
  st.token = store.get("token");
  if (st.token) boot(); else vLogin();
})();
</script>
</body>
</html>
